<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
  <title id="title">Customer interaction lifecycle</title>
  <desc id="description">Three application states show a customer action moving from intent, through waiting, to a ready interface.</desc>
  <style>
    .background { fill: #f3f5ef; }
    .card { fill: #fff; stroke: #d9ddd2; }
    .chrome { fill: #f0f2eb; }
    .text { fill: #272923; }
    .muted { fill: #a8ada2; }
    .line { fill: #dfe3d9; }
    .accent { fill: #168465; }
    .accent-soft { fill: #ddefe8; }
    .waiting { fill: #f1e9cd; }
    .connector { stroke: #168465; }

    @media (prefers-color-scheme: dark) {
      .background { fill: #20221d; }
      .card { fill: #292b25; stroke: #3d4037; }
      .chrome { fill: #33362e; }
      .text { fill: #f0f0e9; }
      .muted { fill: #75796f; }
      .line { fill: #464a40; }
      .accent { fill: #71d9b7; }
      .accent-soft { fill: #29473d; }
      .waiting { fill: #4b442c; }
      .connector { stroke: #71d9b7; }
    }
  </style>

  <rect class="background" width="1200" height="640" />

  <g class="connector" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M398 318h32" />
    <path d="m418 304 14 14-14 14" />
    <path d="M772 318h32" />
    <path d="m792 304 14 14-14 14" />
  </g>

  <g transform="translate(64 96)">
    <rect class="card" width="326" height="448" rx="26" stroke-width="2" />
    <path class="chrome" d="M26 0h274a26 26 0 0 1 26 26v40H0V26A26 26 0 0 1 26 0Z" />
    <circle class="muted" cx="28" cy="33" r="6" />
    <circle class="muted" cx="48" cy="33" r="6" />
    <circle class="muted" cx="68" cy="33" r="6" />
    <rect class="line" x="28" y="104" width="176" height="20" rx="10" />
    <rect class="line" x="28" y="142" width="260" height="12" rx="6" />
    <rect class="line" x="28" y="166" width="214" height="12" rx="6" />
    <rect class="chrome" x="28" y="216" width="270" height="90" rx="14" />
    <rect class="line" x="46" y="238" width="132" height="12" rx="6" />
    <rect class="line" x="46" y="263" width="92" height="10" rx="5" />
    <rect class="accent" x="171" y="340" width="127" height="54" rx="27" />
    <path d="m216 361 10 10 20-22" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <text class="text" x="28" y="420" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="500" letter-spacing="2">START / INTENT</text>
  </g>

  <g transform="translate(438 96)">
    <rect class="card" width="326" height="448" rx="26" stroke-width="2" />
    <path class="chrome" d="M26 0h274a26 26 0 0 1 26 26v40H0V26A26 26 0 0 1 26 0Z" />
    <circle class="muted" cx="28" cy="33" r="6" />
    <circle class="muted" cx="48" cy="33" r="6" />
    <circle class="muted" cx="68" cy="33" r="6" />
    <rect class="line" x="28" y="104" width="176" height="20" rx="10" />
    <rect class="line" x="28" y="142" width="260" height="12" rx="6" />
    <rect class="line" x="28" y="166" width="214" height="12" rx="6" />
    <rect class="waiting" x="28" y="216" width="270" height="150" rx="18" />
    <circle class="connector" cx="163" cy="278" r="32" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="130 72" />
    <rect class="line" x="106" y="331" width="114" height="10" rx="5" />
    <text class="text" x="28" y="420" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="500" letter-spacing="2">WAITING</text>
  </g>

  <g transform="translate(812 96)">
    <rect class="card" width="326" height="448" rx="26" stroke-width="2" />
    <path class="chrome" d="M26 0h274a26 26 0 0 1 26 26v40H0V26A26 26 0 0 1 26 0Z" />
    <circle class="muted" cx="28" cy="33" r="6" />
    <circle class="muted" cx="48" cy="33" r="6" />
    <circle class="muted" cx="68" cy="33" r="6" />
    <circle class="accent-soft" cx="163" cy="162" r="58" />
    <path class="connector" d="m137 162 18 18 36-42" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <rect class="line" x="82" y="246" width="162" height="20" rx="10" />
    <rect class="line" x="50" y="286" width="226" height="12" rx="6" />
    <rect class="line" x="82" y="312" width="162" height="12" rx="6" />
    <rect class="accent" x="92" y="350" width="142" height="44" rx="22" />
    <text class="text" x="28" y="420" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="500" letter-spacing="2">END / READY</text>
  </g>
</svg>
